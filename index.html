function exportPay(){if(typeof XLSX==='undefined'){alert('مكتبة الإكسل لم تُحمّل — تأكد من الاتصال بالإنترنت');return}const d=pDays(curP),rows=S.emps.filter(e=>inP(e,d)).map(e=>{const p=pay(e,d);return{'الموظف':e.name,'الوظيفة':RL[e.role],'أيام العمل':p.wk,'المرتب المستحق':m0(p.sEff),'سفر':p.s.s,'بيات':p.s.b,'البدلات':p.al,'حوافز':m0(p.bon),'غياب':p.s.abs,'اعتيادي':p.s.casual,'خصم الأيام':m0(p.ddAmt),'سلف':m0(p.loan),'خصومات':m0(p.oth),'تأمينات':m0(p.ins),'الصافي':m0(p.net)}}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'المرتبات');XLSX.writeFile(wb,'مرتبات-'+d[0]+'.xlsx')}
function payroll(){const d=pDays(curP),L=S.emps.filter(e=>inP(e,d)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(e=>({e,p:pay(e,d)})),T=k=>m0(L.reduce((a,x)=>a+x.p[k],0)),lk=S.locks[curP];
return bar('💰 المرتبات')+`<div class=w>${ph('كشف المرتبات '+fmt(d[0])+' ← '+fmt(d[d.length-1]))}<div class="card noprint">${psel()}<div class=row style="margin-top:8px"><button onclick="print()">🖨 طباعة الكشف</button><button style="background:#059669" onclick='slips(${JSON.stringify(L.map(x=>x.e.id))})'>🖨 مفردات الكل</button><button style="background:#0891b2" onclick="exportPay()">📤 تصدير إكسل</button>
${lk?`<span class=chip style="background:#16a34a;padding:8px 12px">🔒 معتمدة ${fmt(lk.at)} — ${lk.net}</span><button style="background:#dc2626" onclick="lockP(0)">🔓 فتح القفل</button>`:`<button style="background:#d97706" onclick="lockP(1)">✅ اعتماد وقفل الفترة</button>`}</div>
<small>قيمة اليوم = المرتب ÷ 30 | غياب=${S.abs} يوم، اعتيادي=${S.cas} يوم | سفر ${S.rate.s} / بيات ${S.rate.b} | مرتب التعيين/الاستقالة بنسبة أيام العمل</small></div>
<div class="card ov"><table><tr><th>الموظف<th>أيام العمل<th>المرتب المستحق<th>سفر<th>بيات<th>البدلات<th>حوافز<th>غياب<th>اعتيادي<th>خصم الأيام<th>سلف<th>خصومات<th>تأمينات<th>الصافي<th class=noprint></tr>
${L.map(({e,p})=>`<tr><td>${esc(e.name)}<td>${p.wk}<td>${m0(p.sEff)}<td>${p.s.s}<td>${p.s.b}<td>${p.al}<td>${m0(p.bon)}<td>${p.s.abs}<td>${p.s.casual}<td>${m0(p.ddAmt)}<td>${m0(p.loan)}<td>${m0(p.oth)}<td>${m0(p.ins)}<td><b>${m0(p.net)}</b><td class=noprint><button style="padding:3px 8px" onclick="slips(['${e.id}'])">🖨 مفردات</button></tr>`).join('')}
<tr style="background:#e0e7ff;color:#1e2a44"><td>الإجمالي<td><td>${T('sEff')}<td><td><td>${T('al')}<td>${T('bon')}<td><td><td>${T('ddAmt')}<td>${T('loan')}<td>${T('oth')}<td>${T('ins')}<td><b>${T('net')}</b><td class=noprint></tr></table></div></div>`}
function trucksPg(){const today=new Date().setHours(0,0,0,0),cd=s=>{if(!s)return'';const n=Math.round((dt(s)-today)/864e5);return`<span class=chip style="background:${n<0?'#dc2626':n<=30?'#d97706':'#16a34a'}">${n<0?'منتهي':n+' يوم'}</span>`};
return bar('🚛 العربيات والتراخيص')+`<div class=w><div class=card><button onclick="S.trucks.push({id:uid(),plate:'',lic:'',insx:'',note:''});save();render()">➕ عربية</button> <small>العربيات بتتضاف تلقائياً من الروتة. أدخل تواريخ انتهاء الترخيص والتأمين وهيظهر تنبيه في الرئيسية قبل 30 يوم.</small></div>
<div class="card ov"><table><tr><th>العربية / اللوحة<th>انتهاء الترخيص<th><th>انتهاء التأمين<th><th>ملاحظات<th></tr>${S.trucks.map(t=>`<tr><td><input value="${esc(t.plate)}" onchange="upT('${t.id}','plate',this.value)"><td><input type=date value="${t.lic||''}" onchange="upT('${t.id}','lic',this.value)"><td>${cd(t.lic)}<td><input type=date value="${t.insx||''}" onchange="upT('${t.id}','insx',this.value)"><td>${cd(t.insx)}<td><input value="${esc(t.note)}" onchange="upT('${t.id}','note',this.value)"><td><button style="padding:3px 8px;background:#dc2626" onclick="delT('${t.id}')">✕</button></tr>`).join('')}</table></div></div>`}
const upT=(id,k,v)=>{S.trucks.find(t=>t.id==id)[k]=v;save();if(k=='lic'||k=='insx')render()};
const delT=id=>{snap('تم حذف العربية');S.trucks=S.trucks.filter(t=>t.id!=id);save();render()};
function free(){const d=pDays(curP),L=S.free.filter(f=>f.date>=d[0]&&f.date<=d[d.length-1]).sort((a,b)=>a.date<b.date?-1:1),T={};L.forEach(f=>T[f.name]=(T[f.name]||0)+f.amt);
return bar('🧑‍🔧 المستقلين')+`<div class=w><div class=card><div class=row><input id=ffn placeholder="اسم المستقل"><input type=date id=ffd value="${iso(new Date())}"><input id=ffa type=number placeholder="الأجر" style="width:90px"><input id=ffo placeholder="ملاحظة"><button onclick="addFree()">إضافة</button></div></div>
<div class=card>${psel()}<b>إجمالي كل مستقل:</b> ${Object.entries(T).map(([k,v])=>`<div>${esc(k)}: <b>${v}</b></div>`).join('')||'—'}<div class=ov><table><tr><th>التاريخ<th>الاسم<th>الأجر<th>ملاحظة<th></tr>${L.map(f=>`<tr><td>${fmt(f.date)}<td>${esc(f.name)}<td>${f.amt}<td>${esc(f.note)}<td><button style="padding:3px 8px;background:#dc2626" onclick="S.free=S.free.filter(x=>x.id!='${f.id}');save();render()">✕</button></tr>`).join('')}</table></div></div></div>`}
function addFree(){if(!$('#ffn').value)return;S.free.push({id:uid(),name:$('#ffn').value,date:$('#ffd').value,amt:+$('#ffa').value||0,note:$('#ffo').value});save();render()}
function logo(f){if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){alert('الصيغ المسموحة PNG أو JPG أو WEBP فقط');return}if(f.size>300000){alert('الصورة كبيرة — اختر صورة أقل من 300KB');return}const r=new FileReader();r.onload=()=>{S.company.logo=r.result;save();render()};r.readAsDataURL(f)}
const pwOk=p=>p.length>=10&&/[a-zA-Z]/.test(p)&&/\d/.test(p),PWMSG='كلمة السر لازم تكون 10 أحرف على الأقل وفيها حروف وأرقام';
async function chgPw(){const p=$('#npw2').value;if(!pwOk(p)){alert(PWMSG);return}const{error}=await sb.auth.updateUser({password:p});alert(error?'تعذر تغيير كلمة السر':'تم تغيير كلمة السر');$('#npw2').value=''}
function settings(){return bar('⚙️ إعدادات')+`<div class=w>${CLOUD?`<div class=card><b>🔒 الحساب والأمان</b><div style="margin:6px 0">${esc(USER.email)} — <span class=chip style="background:#2563eb">${RN[ROLE]}</span></div><div class=row><input type=password id=npw2 autocomplete=new-password placeholder="كلمة سر جديدة (10 أحرف+)"><button onclick="chgPw()">تغيير كلمة السر</button><button style="background:#64748b" onclick="logout()">تسجيل خروج</button></div><small>خروج تلقائي بعد 30 دقيقة بدون نشاط. إدارة المستخدمين والصلاحيات من Supabase (راجع README).</small></div>`:`<div class="al red">⚠️ الوضع المحلي: لا يوجد تسجيل دخول ولا صلاحيات. للتجربة فقط — فعّل Supabase من ملف config.js قبل إدخال بيانات الشركة.</div>`}<div class=card><b>بيانات الشركة (تظهر في الطباعة)</b><div class=row style="margin-top:6px"><input placeholder="اسم الشركة" value="${esc(S.company.n)}" onchange="S.company.n=this.value;save()"><input type=file accept="image/*" onchange="logo(this.files[0])">${S.company.logo?`<img src="${S.company.logo}" style="height:40px"><button onclick="S.company.logo='';save();render()">حذف اللوجو</button>`:''}</div></div>
<div class=card><b>القيم والقواعد</b><div class=row style="margin-top:6px">سفر <input type=number style="width:80px" value=${S.rate.s} onchange="S.rate.s=+this.value;save()"> بيات <input type=number style="width:80px" value=${S.rate.b} onchange="S.rate.b=+this.value;save()">
خصم الغياب (أيام) <input type=number style="width:60px" value=${S.abs} onchange="S.abs=+this.value;save()"> خصم الاعتيادي <input type=number style="width:60px" value=${S.cas} onchange="S.cas=+this.value;save()"> سقف الاعتيادي في السنة <input type=number style="width:60px" value=${S.casCap} onchange="S.casCap=+this.value;save()">
<label><input type=checkbox ${S.carry?'checked':''} onchange="S.carry=this.checked;save()"> ترحيل المتبقي من السنوي للسنة التالية</label></div></div>
<div class=card><b>تصنيف المناطق</b><br><small>أي منطقة اسمها يحتوي على الكلمة تتصنف كده. اللي مش مذكورة = حضور عادي. أي ملاحظة فيها "ايام/يوم/ثالث/تاني" = سفر 200 فقط.</small>
<div class=ov><table>${S.areas.map((a,i)=>`<tr><td><input value="${esc(a.k)}" onchange="S.areas[${i}].k=this.value;save()"><td><select onchange="S.areas[${i}].t=this.value;save()"><option ${a.t=='سفر'?'selected':''}>سفر<option ${a.t=='بيات'?'selected':''}>بيات</select><td><button style="padding:3px 8px;background:#dc2626" onclick="S.areas.splice(${i},1);save();render()">✕</button></tr>`).join('')}</table></div><button onclick="S.areas.push({k:'',t:'سفر'});save();render()">➕ منطقة</button></div>
<div class=card><b>نسخة احتياطية</b> (البيانات محفوظة في متصفحك — بتتنزل نسخة تلقائياً كل أسبوع أول ما تفتح الصفحة${S.lastBk?' | آخر نسخة: '+fmt(S.lastBk):''})<div class=row style="margin-top:6px"><button onclick="bk()">⬇️ تحميل نسخة</button><span style="background:#ecfeff;border-radius:10px;padding:6px;color:#1e2a44">⬆️ استرجاع: <input type=file accept=.json onchange="rs(this.files[0])"></span>${CLOUD?'':`<button style="background:#dc2626" onclick="if(confirm('مسح كل البيانات؟')){localStorage.removeItem(LS);location.reload()}">🗑 مسح الكل</button>`}</div></div>
<div class=card><b>📜 سجل التعديلات (آخر 100)</b><div class=ov style="max-height:320px;overflow-y:auto"><table><tr><th>الوقت<th>المستخدم<th>العملية</tr>${S.log.slice(0,100).map(x=>`<tr><td style="white-space:nowrap">${new Date(x.t).toLocaleString('ar-EG')}<td>${esc(x.u||'')}<td>${esc(x.m)}</tr>`).join('')||'<tr><td colspan=2>—'}</table></div></div></div>`}
function bk(){if(CLOUD&&ROLE!='admin'){alert('تحميل النسخة الاحتياطية للمدير فقط');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='hr-backup-'+iso(new Date())+'.json';a.click()}
async function rs(f){if(CLOUD&&!['admin','hr'].includes(ROLE)){alert('غير مصرح');return}try{S=JSON.parse(await f.text());fix();save();alert('تم الاسترجاع');go('')}catch(e){alert('ملف غير صالح')}}
const logout=async()=>{if(dirty&&!confirm('فيه تعديلات لسه بتتحفظ. تخرج؟'))return;await sb.auth.signOut();location.reload()};
function showLogin(msg){$('#app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:16px"><div class=card style="width:100%;max-width:380px;margin:0"><div style="text-align:center;margin-bottom:10px"><div style="font-size:19px;font-weight:700">🚚 نظام الموارد البشرية</div><small style="color:var(--mut)">تسجيل الدخول للمصرّح لهم فقط</small></div>${msg?`<div class="al red">${esc(msg)}</div>`:''}
<label>البريد الإلكتروني<br><input id=lem type=email autocomplete=username style="width:100%" dir=ltr></label><br><br><label>كلمة السر<br><input id=lpw type=password autocomplete=current-password style="width:100%" dir=ltr onkeydown="if(event.key=='Enter')doLogin()"></label><br><br>
<button style="width:100%" onclick="doLogin()">دخول</button><p style="text-align:center;margin:10px 0 0"><a href="#" onclick="forgot();return false">نسيت كلمة السر؟</a></p></div></div>`;icons($('#app'))}
function showNewPw(){RECOV=true;$('#app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:16px"><div class=card style="width:100%;max-width:380px;margin:0"><b>تعيين كلمة سر جديدة</b><br><br><input id=npw type=password autocomplete=new-password dir=ltr style="width:100%" placeholder="10 أحرف على الأقل (حروف وأرقام)"><br><br><button style="width:100%" onclick="setNewPw()">حفظ</button></div></div>`}
async function setNewPw(){const p=$('#npw').value;if(!pwOk(p)){alert(PWMSG);return}const{error}=await sb.auth.updateUser({password:p});if(error){alert('تعذر التغيير');return}alert('تم تغيير كلمة السر، سجّل دخول من جديد');await sb.auth.signOut();location.hash='';location.reload()}
async function forgot(){const em=($('#lem').value||'').trim();if(!em){alert('اكتب بريدك أولاً');return}await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});alert('لو البريد مسجل هيوصلك لينك لتغيير كلمة السر')}
async function doLogin(){const now=Date.now();if(now<lockUntil){showLogin('محاولات كتير. استنى '+Math.ceil((lockUntil-now)/1000)+' ثانية');return}
const em=$('#lem').value.trim(),pw=$('#lpw').value;if(!em||!pw)return;const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
if(error||!data.session){fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}showLogin('بيانات الدخول غير صحيحة');return}fails=0;await afterLogin(data.session)}
async function afterLogin(session){if(RECOV)return;const{data:pr,error}=await sb.from('profiles').select('role,active,full_name').eq('id',session.user.id).maybeSingle();
if(error||!pr||!pr.active){await sb.auth.signOut();showLogin('حسابك غير مفعّل. تواصل مع مدير النظام.');return}
ROLE=pr.role;USER={email:session.user.email,name:pr.full_name||session.user.email};if(!(await loadCloud())){ROLE='';return}startIdle();document.body.classList.toggle('dk',dk0());render()}
function startIdle(){const r=()=>{clearTimeout(idleT);idleT=setTimeout(async()=>{await sb.auth.signOut();location.reload()},30*60e3)};['click','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,r,{passive:true}));r()}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',async()=>{if(!CLOUD||!ROLE||document.hidden||dirty||pushing)return;const{data}=await sb.from('hr_state').select('id,version');if(data&&data.some(x=>x.version!==VER[x.id])){if(await loadCloud())render()}});
async function boot(){document.body.classList.toggle('dk',dk0());
if(!CLOUD){if(CFG.url&&!window.supabase)alert('تعذر تحميل مكتبة الدخول — تأكد من الاتصال بالإنترنت');render();
if(Object.keys(S.days).length&&(!S.lastBk||(Date.now()-dt(S.lastBk))/864e5>=7)){S.lastBk=today0();save();setTimeout(bk,600)}return}
if(top!==self){document.body.innerHTML='<p style="padding:20px">لأسباب أمنية لا يمكن فتح النظام داخل إطار.</p>';return}
sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')showNewPw()});
const{data:{session}}=await sb.auth.getSession();if(RECOV)return;session?await afterLogin(session):showLogin()}
boot();
</script></body></html>
